<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>URL Auditor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --panel: #12181f;
    --border: #262d38;
    --border-soft: #1c222b;
    --text: #d8dee9;
    --text-dim: #6b7685;
    --accent: #ffb454;
    --good: #56d364;
    --bad: #f85149;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --sans: "Inter", -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(255,180,84,0.05), transparent 45%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 32px);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 64px 20px 40px;
  }

  .wrap {
    width: 100%;
    max-width: 720px;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .eyebrow::before {
    content: "";
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent);
  }

  h1 {
    font-family: var(--mono);
    font-size: 30px;
    font-weight: 600;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }

  .sub {
    color: var(--text-dim);
    font-size: 14px;
    margin: 0 0 32px;
    line-height: 1.5;
  }

  form {
    display: flex;
    gap: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    transition: border-color 0.15s ease;
  }
  form:focus-within {
    border-color: var(--accent);
  }

  .prompt {
    display: flex;
    align-items: center;
    padding: 0 0 0 16px;
    font-family: var(--mono);
    color: var(--text-dim);
    font-size: 14px;
    user-select: none;
  }

  input[type="text"] {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    padding: 16px 10px;
  }
  input[type="text"]::placeholder {
    color: #454f5e;
  }

  button {
    background: var(--accent);
    color: #14181e;
    border: none;
    font-family: var(--mono);
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.03em;
    padding: 0 22px;
    cursor: pointer;
    transition: filter 0.15s ease, opacity 0.15s ease;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .status-line {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--text-dim);
    margin-top: 14px;
    min-height: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-line.error { color: var(--bad); }
  .cursor {
    display: inline-block;
    width: 7px;
    height: 13px;
    background: var(--accent);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  #report {
    margin-top: 28px;
    display: none;
  }

  .report-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .report-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .report-url {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
    word-break: break-all;
  }
  .badge {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .badge.ok { background: rgba(86,211,100,0.12); color: var(--good); }
  .badge.warn { background: rgba(255,180,84,0.12); color: var(--accent); }
  .badge.bad { background: rgba(248,81,73,0.12); color: var(--bad); }

  .metric-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    padding: 13px 20px;
    border-bottom: 1px solid var(--border-soft);
  }
  .metric-row:last-child { border-bottom: none; }

  .metric-label {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
    padding-top: 2px;
    white-space: nowrap;
  }

  .metric-value {
    text-align: right;
    font-size: 14px;
    line-height: 1.5;
    max-width: 70%;
  }
  .metric-value.mono { font-family: var(--mono); }
  .metric-value .flag { color: var(--bad); }
  .metric-value .pass { color: var(--good); }
  .metric-value .muted { color: var(--text-dim); font-style: italic; }

  footer {
    margin-top: auto;
    padding-top: 40px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: #3a4250;
  }

  @media (max-width: 480px) {
    h1 { font-size: 24px; }
    .metric-value { max-width: 60%; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">diagnostic instrument</div>
    <h1>URL Auditor</h1>
    <p class="sub">Enter a page address. It fetches the page and reads back status, timing, structure, and a few basic SEO signals.</p>

    <form id="audit-form">
      <span class="prompt">scan&gt;</span>
      <input
        type="text"
        id="url-input"
        placeholder="example.com or https://example.com/page"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
      />
      <button type="submit" id="submit-btn">Run audit</button>
    </form>

    <div class="status-line" id="status-line"></div>

    <div id="report"></div>
  </div>

 <footer>
  Built for Digital Heroes Training Task ·
  <a href="https://digitalheroesco.com" target="_blank" rel="noopener noreferrer" style="color: var(--accent); text-decoration: none;">digitalheroesco.com</a>
</footer>

  <script>
    const form = document.getElementById('audit-form');
    const input = document.getElementById('url-input');
    const btn = document.getElementById('submit-btn');
    const statusLine = document.getElementById('status-line');
    const reportEl = document.getElementById('report');

    function setStatus(text, isError) {
      statusLine.classList.toggle('error', !!isError);
      statusLine.innerHTML = text ? text : '';
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function statusBadge(code) {
      if (code >= 200 && code < 300) return `<span class="badge ok">${code} OK</span>`;
      if (code >= 300 && code < 400) return `<span class="badge warn">${code} REDIRECT</span>`;
      return `<span class="badge bad">${code} ERROR</span>`;
    }

    function renderReport(data) {
      const missingAlt = data.images.missingAlt;
      const altValue = data.images.total === 0
        ? '<span class="muted">no images found</span>'
        : missingAlt === 0
          ? `<span class="pass">0 of ${data.images.total} missing alt text</span>`
          : `<span class="flag">${missingAlt} of ${data.images.total} missing alt text</span>`;

      const h1Value = data.h1Count === 1
        ? `<span class="pass">1 &mdash; ideal</span>`
        : data.h1Count === 0
          ? `<span class="flag">0 &mdash; no H1 found</span>`
          : `<span class="flag">${data.h1Count} &mdash; more than one H1</span>`;

      reportEl.innerHTML = `
        <div class="report-panel">
          <div class="report-head">
            <div class="report-url">${escapeHtml(data.url)}${data.redirected ? ' <span class="muted">(redirected)</span>' : ''}</div>
            ${statusBadge(data.statusCode)}
          </div>
          <div class="metric-row">
            <div class="metric-label">RESPONSE TIME</div>
            <div class="metric-value mono">${data.responseTimeMs} ms</div>
          </div>
          <div class="metric-row">
            <div class="metric-label">CONTENT TYPE</div>
            <div class="metric-value mono">${escapeHtml(data.contentType || 'unknown')}</div>
          </div>
          <div class="metric-row">
            <div class="metric-label">PAGE TITLE</div>
            <div class="metric-value">${data.title ? escapeHtml(data.title) : '<span class="flag">missing</span>'}</div>
          </div>
          <div class="metric-row">
            <div class="metric-label">META DESCRIPTION</div>
            <div class="metric-value">${data.metaDescription ? escapeHtml(data.metaDescription) : '<span class="flag">missing</span>'}</div>
          </div>
          <div class="metric-row">
            <div class="metric-label">H1 COUNT</div>
            <div class="metric-value mono">${h1Value}</div>
          </div>
          <div class="metric-row">
            <div class="metric-label">IMAGE ALT TEXT</div>
            <div class="metric-value mono">${altValue}</div>
          </div>
          <div class="metric-row">
            <div class="metric-label">WORD COUNT</div>
            <div class="metric-value mono">~${data.wordCount.toLocaleString()}</div>
          </div>
        </div>
      `;
      reportEl.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = input.value.trim();
      if (!url) {
        setStatus('Enter a URL first.', true);
        return;
      }

      btn.disabled = true;
      reportEl.style.display = 'none';
      setStatus('scanning<span class="cursor"></span>', false);

      try {
        const res = await fetch('/api/audit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });

        const data = await res.json();

        if (!res.ok) {
          setStatus(escapeHtml(data.error || `Request failed (${res.status}).`), true);
          return;
        }

        setStatus(`done in ${data.responseTimeMs} ms`, false);
        renderReport(data);
      } catch (err) {
        setStatus('Network error — could not reach the auditor service.', true);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
